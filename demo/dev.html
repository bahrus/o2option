<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <script type=itempropmap id=animal-map>
    {
        "data-scientific-classification": {
            "mapsTo": "taxonomy", 
            "instanceOf": "Object"
        },
        "data-binomial-name": "species",
        "data-population": {
            "mapsTo": "totalCount",
            "instanceOf": "Number"
        },
        "value": "key"
    }
    </script>
    <select itemscope=animals>
        <button>
            <selectedcontent></selectedcontent>
        </button>
        <option value="">Please select a pet</option>
        <div id=div>

        </div>
    </select>
    <script type=module>
        import {a2options} from '/a2options.js';
        import data from './data.mjs' with {type: 'json'}
        import config from './config.json' with {type: 'json'}
        console.log(data, config);
        const fragments = [];
        const encoder = s => fragments.push(s);
        a2options(data, config, encoder);
        div.innerHTML = fragments.join('');
    </script>
    
</body>
</html>
